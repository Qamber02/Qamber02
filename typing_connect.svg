<svg width="650" height="95" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="connBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050810;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#0D0A22;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#050810;stop-opacity:1"/>
    </linearGradient>

    <linearGradient id="connGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="100%" style="stop-color:#A855F7"/>
    </linearGradient>
    <linearGradient id="connGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#A855F7"/>
      <stop offset="100%" style="stop-color:#FF4D6D"/>
    </linearGradient>
    <linearGradient id="connGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFB800"/>
      <stop offset="100%" style="stop-color:#00D4FF"/>
    </linearGradient>

    <filter id="connGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .cl1 { animation: slideConn 0.4s 0.2s ease both; opacity:0; }
      .cl2 { animation: slideConn 0.4s 0.9s ease both; opacity:0; }
      .cl3 { animation: slideConn 0.4s 1.6s ease both; opacity:0; }
      .connCursor { animation: blinkConn 0.9s step-end infinite; }
      @keyframes slideConn {
        from { opacity:0; transform: translateX(-8px); }
        to { opacity:1; transform: translateX(0); }
      }
      @keyframes blinkConn { 0%,100% { opacity:1; } 50% { opacity:0; } }
    </style>
  </defs>

  <!-- Background Panel -->
  <rect width="650" height="95" rx="8" fill="url(#connBg)"/>
  <rect width="646" height="91" x="2" y="2" rx="7" fill="none" stroke="#7C3AED" stroke-width="1" opacity="0.6"/>
  <rect width="640" height="85" x="5" y="5" rx="5" fill="none" stroke="#00D4FF" stroke-width="0.5" opacity="0.3"/>

  <!-- Line 1: Open Opportunities -->
  <text x="20" y="32" font-family="'Courier New', monospace" font-size="12" fill="#00D4FF" opacity="0.7">❯</text>
  <text x="36" y="32" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="url(#connGrad1)" filter="url(#connGlow)" class="cl1">Direct Link: Open to Full-Stack / Backend Internships &amp; Contracts</text>

  <!-- Line 2: Focus & Mission -->
  <text x="20" y="56" font-family="'Courier New', monospace" font-size="12" fill="#A855F7" opacity="0.7">❯</text>
  <text x="36" y="56" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="url(#connGrad2)" filter="url(#connGlow)" class="cl2">Focus: Underserved Market Infrastructure · AI EdTech · High-Scale Systems</text>

  <!-- Line 3: Coordinates & Ping -->
  <text x="20" y="80" font-family="'Courier New', monospace" font-size="12" fill="#FFB800" opacity="0.7">❯</text>
  <text x="36" y="80" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="url(#connGrad3)" filter="url(#connGlow)" class="cl3">Coordinates: 25.1264° N, 62.3225° E · Timezone: PKT (UTC+5) · Always Shipping</text>

  <!-- Blinking Terminal Cursor -->
  <rect x="620" y="70" width="7" height="13" rx="1" fill="#00D4FF" class="connCursor" filter="url(#connGlow)"/>
</svg>
