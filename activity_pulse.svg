<svg width="420" height="70" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050810;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0D0A22;stop-opacity:1"/>
    </linearGradient>

    <radialGradient id="radarPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:0.8"/>
      <stop offset="60%" style="stop-color:#7C3AED;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:0"/>
    </radialGradient>

    <filter id="pGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .radarRing1 { animation: radarSweep 2.4s ease-out infinite; transform-origin: 35px 35px; }
      .radarRing2 { animation: radarSweep 2.4s 0.8s ease-out infinite; transform-origin: 35px 35px; }
      .radarRing3 { animation: radarSweep 2.4s 1.6s ease-out infinite; transform-origin: 35px 35px; }
      .radarCore { animation: corePulse 1.8s ease-in-out infinite; }
      @keyframes radarSweep {
        0% { r: 5; opacity: 0.9; stroke: #00D4FF; }
        50% { stroke: #A855F7; }
        100% { r: 28; opacity: 0; stroke: #FF4D6D; }
      }
      @keyframes corePulse {
        0%, 100% { r: 4; fill: #00D4FF; }
        50% { r: 5.5; fill: #FFB800; }
      }
    </style>
  </defs>

  <!-- Panel Base -->
  <rect width="420" height="70" rx="8" fill="url(#panelBg)" stroke="#7C3AED" stroke-width="0.9"/>
  <rect width="416" height="66" x="2" y="2" rx="7" fill="none" stroke="#00D4FF" stroke-width="0.4" opacity="0.4"/>

  <!-- Radar Rings -->
  <circle cx="35" cy="35" r="5" fill="none" stroke-width="1.2" class="radarRing1"/>
  <circle cx="35" cy="35" r="5" fill="none" stroke-width="1" class="radarRing2"/>
  <circle cx="35" cy="35" r="5" fill="none" stroke-width="0.8" class="radarRing3"/>

  <!-- Radar Core & Target Reticle -->
  <circle cx="35" cy="35" r="4" class="radarCore" filter="url(#pGlow)"/>
  <circle cx="35" cy="35" r="1.5" fill="#050810"/>
  <line x1="35" y1="12" x2="35" y2="18" stroke="#00D4FF" stroke-width="1" opacity="0.6"/>
  <line x1="35" y1="52" x2="35" y2="58" stroke="#00D4FF" stroke-width="1" opacity="0.6"/>
  <line x1="12" y1="35" x2="18" y2="35" stroke="#00D4FF" stroke-width="1" opacity="0.6"/>
  <line x1="52" y1="35" x2="58" y2="35" stroke="#00D4FF" stroke-width="1" opacity="0.6"/>

  <!-- Status Text -->
  <text x="75" y="28" font-family="'Courier New', monospace" font-size="11.5" font-weight="bold" fill="#00D4FF" letter-spacing="1">SIGNAL LOCKED · 25.1264° N, 62.3225° E</text>
  <text x="75" y="46" font-family="'Courier New', monospace" font-size="10" fill="#E6EDF3">Gwadar, Balochistan · <tspan fill="#FFB800" font-weight="bold">~650km From Nearest Coverage</tspan></text>
  <text x="75" y="60" font-family="'Courier New', monospace" font-size="9" fill="#A855F7">STATUS: ACTIVE SHIPPING // NOBARA LINUX DEV ENVIRONMENT</text>
</svg>
