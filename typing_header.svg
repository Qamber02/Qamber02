<svg width="700" height="120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050810;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#0D0A22;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#050810;stop-opacity:1"/>
    </linearGradient>

    <!-- Neon Gradients -->
    <linearGradient id="neonCyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="60%" style="stop-color:#A855F7"/>
      <stop offset="100%" style="stop-color:#FF4D6D"/>
    </linearGradient>
    <linearGradient id="neonVioletGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#A855F7"/>
      <stop offset="60%" style="stop-color:#00D4FF"/>
      <stop offset="100%" style="stop-color:#FFB800"/>
    </linearGradient>
    <linearGradient id="neonAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFB800"/>
      <stop offset="100%" style="stop-color:#00D4FF"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .cursor { animation: blink 0.8s step-end infinite; }
      @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0; } }

      .sysLine1 { animation: sysReveal 0.5s ease forwards; }
      .sysLine2 { animation: sysReveal 0.5s 0.8s ease both; opacity:0; }
      .sysLine3 { animation: sysReveal 0.5s 1.6s ease both; opacity:0; }
      @keyframes sysReveal {
        from { opacity:0; transform: translateX(-12px); }
        to { opacity:1; transform: translateX(0); }
      }
    </style>
  </defs>

  <!-- Panel Base -->
  <rect width="700" height="120" rx="10" fill="url(#cyberBg)"/>
  
  <!-- Cyber Borders & Grid Lines -->
  <rect width="698" height="118" x="1" y="1" rx="9" fill="none" stroke="#7C3AED" stroke-width="1.2" opacity="0.6"/>
  <rect width="692" height="112" x="4" y="4" rx="7" fill="none" stroke="#00D4FF" stroke-width="0.6" opacity="0.3"/>
  
  <!-- Corner Tech Markers -->
  <path d="M 12 6 L 6 6 L 6 12" fill="none" stroke="#00D4FF" stroke-width="2"/>
  <path d="M 688 6 L 694 6 L 694 12" fill="none" stroke="#00D4FF" stroke-width="2"/>
  <path d="M 12 114 L 6 114 L 6 108" fill="none" stroke="#7C3AED" stroke-width="2"/>
  <path d="M 688 114 L 694 114 L 694 108" fill="none" stroke="#7C3AED" stroke-width="2"/>

  <!-- System Badge -->
  <rect x="20" y="14" width="220" height="18" rx="4" fill="#180B38" stroke="#A855F7" stroke-width="0.8"/>
  <circle cx="28" cy="23" r="3" fill="#00D4FF" filter="url(#neonGlow)"/>
  <text x="36" y="27" font-family="'Courier New', monospace" font-size="9.5" font-weight="bold" fill="#00D4FF" letter-spacing="1.5">SYSTEM ACTIVE // SHADOW MONARCH</text>

  <!-- Line 1: Class & Identity -->
  <text x="20" y="52" font-family="'Courier New', monospace" font-size="12" fill="#7C3AED" opacity="0.8">❯</text>
  <text x="36" y="52" font-family="'Courier New', monospace" font-size="12.5" font-weight="bold" fill="url(#neonCyanPurple)" filter="url(#neonGlow)" class="sysLine1">Class: Full-Stack Architect  ·  BSCS @ University of Turbat (GPA 3.40)</text>

  <!-- Line 2: Mission & Gap -->
  <text x="20" y="78" font-family="'Courier New', monospace" font-size="12" fill="#00D4FF" opacity="0.8">❯</text>
  <text x="36" y="78" font-family="'Courier New', monospace" font-size="12.5" font-weight="bold" fill="url(#neonVioletGold)" filter="url(#neonGlow)" class="sysLine2">Origin: Gwadar (25°N, 62°E)  ·  Building 650km from where the apps stop</text>

  <!-- Line 3: Tech Engine -->
  <text x="20" y="104" font-family="'Courier New', monospace" font-size="12" fill="#FF4D6D" opacity="0.8">❯</text>
  <text x="36" y="104" font-family="'Courier New', monospace" font-size="12.5" font-weight="bold" fill="url(#neonAmber)" filter="url(#neonGlow)" class="sysLine3">Arsenal: Flutter · FastAPI · React 19 · Supabase · Autonomous AI Agents</text>

  <!-- Blinking Cursor -->
  <rect x="668" y="93" width="8" height="14" rx="1" fill="#00D4FF" class="cursor" filter="url(#neonGlow)"/>
</svg>
